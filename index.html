
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero UC Store</title>
<style>
body {
  background: #101827;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 25px;
}
h1 { color: #f5c542; }
.card {
  background: #202d40;
  padding: 20px;
  margin: 15px auto;
  border-radius: 12px;
  max-width: 320px;
}
button {
  background: #f5c542;
  border: 0;
  padding: 12px 25px;
  border-radius: 8px;
  font-weight: bold;
}
</style>
</head>
<body>
<h1>ZERO UC STORE</h1>
<p>Your Gaming Recharge Demo</p>

<div class="card">
<h2>60 UC</h2>
<h3>$0.99</h3>
<button>Demo Only</button>
</div>

<div class="card">
<h2>325 UC</h2>
<h3>$4.99</h3>
<button>Demo Only</button>
</div>

<div class="card">
<h2>660 UC</h2>
<h3>$9.99</h3>
<button>Demo Only</button>
</div>

<p>Independent Demo Website</p>
<p>Not affiliated with PUBG MOBILE.</p>
</
<section class="card">
  <h2>Place Your Demo Order</h2>

  <p>Player ID (Sample Only)</p>
  <input
    type="text"
    value="123456789"
    readonly
  >

  <p>Select UC Package</p>
  <select disabled>
    <option>60 UC - $0.99</option>
    <option>325 UC - $4.99</option>
    <option>660 UC - $9.99</option>
  </select>

  <p style="color:#f5c542">
    Demo Mode - No real orders accepted.
  </p>

  <button disabled>Demo Only</button>
</section>
